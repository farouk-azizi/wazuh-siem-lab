---
- name: Deploy Wazuh agent on Linux endpoints
  hosts: agents
  become: yes
  become_user: root

  roles:
    - role: ansible-wazuh-agent

  vars:
    wazuh_managers:
      - address: 192.168.8.129
        port: 1514
        protocol: tcp
        api_port: 55000
        api_proto: 'https'
        api_user: wazuh
        max_retries: 5
        retry_interval: 5